<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('leadscout-theme') || 'system';
          var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = theme;
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>LeadScout — Find better leads. Start better conversations.</title>
    <meta
      name="description"
      content="LeadScout helps teams discover high-intent local businesses, qualify them automatically, and manage outreach in one focused pipeline."
    />
    <meta property="og:title" content="LeadScout — Find better leads. Start better conversations." />
    <meta
      property="og:description"
      content="Discover high-intent local businesses, qualify them automatically, and keep every conversation moving in one focused pipeline."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
